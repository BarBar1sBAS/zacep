<!doctype html><meta charset="utf-8"><style>body{font:14px system-ui;background:#f3f0e8;color:#0a0a0a;padding:18px}button{background:#c8ff00;border:1px solid;padding:12px}pre{white-space:pre-wrap;line-height:1.4}</style><b>Продуктовый макет · UI Kit · Айдентика</b><pre id="log">Сборка…</pre><button id="close">Закрыть</button><script>
const base='http://localhost:8795';const log=document.getElementById('log');document.getElementById('close').onclick=()=>parent.postMessage({pluginMessage:{type:'close'}},'*');onmessage=async e=>{const m=e.data.pluginMessage;if(!m)return;if(m.type==='ready'){const a=await(await fetch(base+'/assets')).json();parent.postMessage({pluginMessage:{type:'build',assets:Object.fromEntries(Object.entries(a).map(([k,s])=>[k,Array.from(Uint8Array.from(atob(s),x=>x.charCodeAt(0)))]))}},'*');}if(m.type==='log')log.textContent=m.text;if(m.type==='save'){await fetch(base+'/save/'+m.name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(m.data)});log.textContent='Сохранено: '+m.name;}if(m.type==='image')await fetch(base+'/image/'+m.name,{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:new Uint8Array(m.bytes)});};
</script>
